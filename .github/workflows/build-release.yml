name: build-release

# 云端构建发布镜像：runner 动态解析 nura latest 料件（apk/ESP/固件，sha 门禁兜底）
# → build.sh 适配 → xz 压缩切 1900M（GitHub 资产单件上限 2GiB 内，xz ≈5.3G → 3 卷）→ 挂本仓 Release。镜像本体零本地上行。
# 发新版：改 kernel-m2381/BUILD.env（OUR_VER + 各 sha 钉子）→ 手动触发本 workflow。
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # 发布口径：不注入调试 pubkey（root 密码 123456 = README 文档口径）
  PUBKEY: ""
  NURA_REPO: RiverKawa271828/nura-meizu-m2381

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deps (attr for FEX xattr)
        run: sudo apt-get update -qq && sudo apt-get install -y attr jq

      - name: Fetch upstream rootfs (armada-sheng flashable)
        run: bash build_files/fetch-base.sh

      - name: Fetch materials from nura latest (sha256 gated)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source kernel-m2381/BUILD.env
          TAG=$(gh api repos/${NURA_REPO}/releases/latest --jq .tag_name)
          echo "nura latest tag = ${TAG}（BUILD.env 钉子 = ${KERNEL_APK_VERSION}）"
          if [ "${TAG}" != "${KERNEL_APK_VERSION}" ]; then
            echo "WARN: nura latest ≠ 钉子——sha 门禁兜底；若为未验证新料件，实机验证后更新 BUILD.env 再跑"
          fi
          mkdir -p work/armada-m2381/apk work/cache
          ASSETS=$(gh api repos/${NURA_REPO}/releases/tags/${TAG} --jq '.assets[].name')
          # r91 起固件改 tarball 分发（无 apk）——正则同时接受两种形态；head -1 防多件多行
          APK_ASSET=$(echo "${ASSETS}" | grep -E '^linux-meizu-meizu20-.*\.apk$' | head -1)
          FW_ASSET=$(echo "${ASSETS}"   | grep -E '^firmware-meizu-meizu20.*\.(apk|tar\.gz)$' | head -1)
          ESP_ASSET=$(echo "${ASSETS}"  | grep -E '^esp-recovery-v[0-9]+\.img\.gz$' | head -1)
          for a in "${APK_ASSET}" "${FW_ASSET}" "${ESP_ASSET}"; do
            [ -n "${a}" ] || { echo "ERROR: nura latest（${TAG}）缺料件资产（apk/固件/ESP）" >&2; exit 1; }
          done
          echo "料件：${APK_ASSET} / ${FW_ASSET} / ${ESP_ASSET}"
          DL=https://github.com/${NURA_REPO}/releases/download/${TAG}
          curl -fsSL --retry 3 -o "work/armada-m2381/apk/${APK_ASSET}" "${DL}/${APK_ASSET}"
          curl -fsSL --retry 3 -o "work/armada-m2381/apk/${FW_ASSET}" "${DL}/${FW_ASSET}"
          curl -fsSL --retry 3 -o "work/cache/${ESP_ASSET}" "${DL}/${ESP_ASSET}"
          echo "${KERNEL_APK_SHA256}  work/armada-m2381/apk/${APK_ASSET}" | sha256sum -c -
          echo "${FIRMWARE_APK_SHA256}  work/armada-m2381/apk/${FW_ASSET}" | sha256sum -c -
          # ESP 版本名随资产走（esp-recovery-vNN.img）——build.sh ESP_REF 与翻钉同轮更版
          ESP_VER=$(echo "${ESP_ASSET}" | sed -E 's/^esp-recovery-(v[0-9]+)\.img\.gz$/\1/')
          gunzip -kc "work/cache/${ESP_ASSET}" > "work/cache/esp-recovery-${ESP_VER}.img"
          echo "${ESP_IMG_SHA256}  work/cache/esp-recovery-${ESP_VER}.img" | sha256sum -c -

      - name: Build image (adapt → shrink → verify)
        run: sudo bash build_files/build.sh

      - name: Compress and split (xz, 1900M parts)
        run: |
          set -euo pipefail
          source kernel-m2381/BUILD.env
          cd work
          # build.sh 以 sudo 跑，产物属 root——runner 用户的 xz 保留属组会 EPERM
          sudo chown "$(id -u):$(id -g)" "meizu-meizu20-armada-${OUR_VER}.img"
          # -6：runner 内存上限会砍 -9 的线程数（4 核被压到 3 线程、57 分钟）；
          # -6 内存充裕全核跑，压缩率损失 ~5%
          xz -T0 -6 -k "meizu-meizu20-armada-${OUR_VER}.img"
          # 1900M：≤2G 口径（用户拍板），GitHub 资产单件上限 2GiB 内；xz ≈5.3G → 3 卷
          split -b 1900M -d -a 2 "meizu-meizu20-armada-${OUR_VER}.img.xz" "meizu-meizu20-armada-${OUR_VER}.img.xz."
          # 注意：glob 不能带引号（引号会抑制 ?? 通配，cat 收到字面量文件名）
          cat meizu-meizu20-armada-${OUR_VER}.img.xz.?? | cmp - meizu-meizu20-armada-${OUR_VER}.img.xz
          sha256sum meizu-meizu20-armada-${OUR_VER}.img.xz.?? > SHA256SUMS
          cat SHA256SUMS

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source kernel-m2381/BUILD.env
          cd work
          NOTES=../docs/RELEASE-NOTES-${OUR_VER}.md
          gh release view "${OUR_VER}" -R "${{ github.repository }}" >/dev/null 2>&1 || {
            if [ -f "${NOTES}" ]; then
              gh release create "${OUR_VER}" -R "${{ github.repository }}" \
                --title "m2381 armada ${OUR_VER}" --notes-file "${NOTES}"
            else
              gh release create "${OUR_VER}" -R "${{ github.repository }}" \
                --title "m2381 armada ${OUR_VER}" --notes "m2381 armada ${OUR_VER} userdata 镜像（CI 构建）"
            fi
          }
          gh release upload "${OUR_VER}" -R "${{ github.repository }}" \
            --clobber meizu-meizu20-armada-${OUR_VER}.img.xz.?? SHA256SUMS
          gh release view "${OUR_VER}" -R "${{ github.repository }}" \
            --json assets --jq '.assets[] | "\(.name) \(.size)"'
